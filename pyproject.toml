[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-distill"
version = "1.0.0"
description = "Logit-based knowledge distillation of a 68.5M-parameter language model into a 6.8M-parameter student"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Reza Torabi" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
notebook = ["jupyter", "pandas"]

[project.urls]
Homepage = "https://www.reza-torabi.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
