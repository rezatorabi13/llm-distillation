# Baseline student: identical architecture, data, seed, batches and optimizer as
# configs/distill.yaml, but trained with ordinary cross-entropy on the real next token.

teacher:
  name: roneneldan/TinyStories-33M     # used only to report KL / agreement at evaluation time

student:
  n_layer: 2
  n_embd: 128
  n_head: 4

data:
  num_train_stories: 30000
  chunk_len: 64
  num_val_chunks: 1000

train:
  method: baseline
  steps: 2000
  batch_size: 32
  lr: 2.0e-3
  weight_decay: 0.01
  grad_clip: 1.0
  eval_every: 500
  amp: true
  seed: 0
